# JSON request validation for NONPROD topic inputs.
VALID_PLATFORM_ENVIRONMENT=nonprod
VALID_MODES=UPSERT,DELETE
CATALOG_ROOT=main/topics
GENERATED_TOPIC_FILE=files/elc-topics.json
GENERATED_TOPIC_TAGS_FILE=files/elc-topics-tags.json
GENERATED_TOPIC_ATTRIBUTES_FILE=files/elc-topic-attributes.json
MAX_PARTITIONS=20
MAX_RETENTION_MS=604800000
TOPIC_NAME_SEPARATOR=_
TOPIC_NAME_PREFIX=elc
TOPIC_NAME_REGEX=^elc_.*_v[0-9]+$
# Optional topic text after data format and before version, for example _json_customerfeed_v1.
TOPIC_FREE_TEXT_PART_REGEX=^[a-z0-9][a-z0-9-]*$
VALID_DATA_CLASSES=restricted
VALID_VISIBILITIES=public,private
VALID_EVENTS=delta,snapshot,transaction,audit,metric
VALID_PROCESSING_STAGES=raw,enriched,canonical,aggregated,inbound,cleanse1
VALID_DATA_FORMATS=json,avro,protobuf,xml,csv,jsonl,text,binary,rawdoc,rawdata