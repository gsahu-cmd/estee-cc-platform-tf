# Root-level settings for scripts/process_json_request.py.
# Set GIT_ENABLED=true to create a branch, commit generated/archive changes, and push it.
# Set GIT_PR_ENABLED=true to create a GitHub PR after branch push. Requires GITHUB_TOKEN.
ARCHIVE_ENABLED=true
ARCHIVE_ROOT=scripts/archive
INPUT_FILE_NAME_REGEX=^(?P<mode>UPSERT|DELETE)-(?P<environment>[A-Za-z0-9-]+)-project-(?P<project>[A-Za-z0-9-]+)-release-(?P<number>[0-9]+)-elc-(?P<request_type>topics|rbac|acl|identity-pool|group-mapping|group-mapping-rbac)\.json$
INPUT_FILE_NAME_PATTERN=<UPSERT|DELETE>-<ENV>-project-<XYZ>-release-<number>-elc-<topics|rbac|acl|identity-pool|group-mapping|group-mapping-rbac>.json
GIT_ENABLED=true
GIT_REPO_URL=https://github.com/gsahu-cmd/estee-cc-platform-tf
GIT_REMOTE_NAME=origin
GIT_BASE_BRANCH=main
GIT_BRANCH_PREFIX=release
GIT_COMMIT_MESSAGE_PREFIX=JSON request update
GIT_PR_ENABLED=true