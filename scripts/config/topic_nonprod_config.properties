# ==========================================
# ELC Confluent Cloud - Topic Configuration - NONPROD
# ==========================================

# CSV Environment Scope
# This tells the generic script this property file is for NONPROD requests.
# Future PROD requests should use a separate topic_prod_config.properties file.
VALID_PLATFORM_ENVIRONMENT=nonprod

# ==========================================
# Naming Convention Pattern
# ==========================================
# Name format follows the Kafka naming convention sheet:
# org_source_optionalDataClass_visibility_object_event_processingStage_optionalFreeText_dataFormat_v1
# Example: elc_sap_public_itemmastersupplement_delta_raw_json_v1
# Example with dataClass: elc_sap_restricted_public_payroll_transaction_raw_json_v1
# TOPIC_NAMING_SEPARATOR joins the main tokens in TOPIC_NAMING_PATTERN.
# TOPIC_NAME_SEPARATOR joins the parts inside the topic name.
TOPIC_NAMING_PATTERN={environment}.{cluster}.{name}
TOPIC_NAMING_SEPARATOR=.
TOPIC_NAME_SEPARATOR=_
TOPIC_NAME_PREFIX=elc
TOPIC_NAME_REGEX=^elc_.*_v[0-9]+$

# ==========================================
# Topic Name Allowed Values
# ==========================================
VALID_DATA_CLASSES=restricted
VALID_VISIBILITIES=public,private
VALID_EVENTS=delta,snapshot,transaction,audit,metric
VALID_PROCESSING_STAGES=raw,enriched,canonical,aggregated,inbound,cleanse1
VALID_DATA_FORMATS=json,avro,protobuf,xml,csv,jsonl,text,binary,rawdoc,rawdata

# ==========================================
# Valid NONPROD Environment and Cluster Combinations
# ==========================================
# Format: environment|cluster,environment|cluster
VALID_ENVIRONMENT_CLUSTERS=elc-sandbox|elc-sandbox-core-enterprise,elc-nonprod-eastus2|elc-nonprod-eastus2-core-enterprise,elc-nonprod-southeastasia|elc-nonprod-southeastasia-core-enterprise,elc-nonprod-uksouth|elc-nonprod-uksouth-core-enterprise,estee-sandbox-eastus2|estee-sandbox-eastus2-core-enterprise,elc-sandbox|elc-sandbox-eastus2-core-basic

# ==========================================
# Confluent Cloud Cluster IDs
# TODO: Replace these sample IDs with real Confluent Kafka cluster IDs before applying Terraform.
# Format: cluster|cluster_id,cluster|cluster_id
# ==========================================
CONFLUENT_CLUSTER_IDS=estee-sandbox-eastus2-core-enterprise|lkc-nvo97m6,elc-sandbox-eastus2-core-basic|lkc-gqn5wn3

# ==========================================
# Topic Defaults
# ==========================================
DEFAULT_PARTITIONS=6
MAX_PARTITIONS=20
# 86400000 ms = 1 day
DEFAULT_RETENTION_MS=86400000
# 604800000 ms = 7 days
MAX_RETENTION_MS=604800000
DEFAULT_CLEANUP_POLICY=delete

# ==========================================
# Mandatory Tags
# Set to NONE if no mandatory tags are required.
# When set to NONE, the CSV tags column can be empty.
# ==========================================
MANDATORY_TAGS=NONE
# MANDATORY_TAGS=PII,Domain,Owner

# ==========================================
# Valid Actions
# ==========================================
VALID_ACTIONS=create,update,delete

# ==========================================
# Valid Types
# ==========================================
VALID_TYPES=topic

# ==========================================
# Topic CSV Columns
# ==========================================
# platform_environment must be nonprod for this property file.
TOPIC_REQUIRED_COLUMNS=type,platform_environment,action,environment,cluster,name,partitions,config,tags
TOPIC_OPTIONAL_COLUMNS=

# ==========================================
# Topic CSV Config Column
# ==========================================
# Expected CSV config format:
# cleanup.policy=compact,delete|retention.ms=604800000
#
# The script will convert this to JSON like:
# "config": {
#   "cleanup.policy": "compact,delete",
#   "retention.ms": "604800000"
# }
TOPIC_CONFIG_PAIR_SEPARATOR=|
TOPIC_CONFIG_KEY_VALUE_SEPARATOR==

# ==========================================
# Git Catalog Update
# ==========================================
# When false, the validation scripts do not clone/push/raise PR.
# Git authentication must come from pipeline secrets or environment variables, not this file.
ENABLE_GIT_CATALOG_UPDATE=true
GIT_REPO_URL=https://github.com/gsahu-cmd/estee-cc-platform-tf
GIT_BASE_BRANCH=main
GIT_BRANCH_PREFIX=topic-request
GIT_CATALOG_ROOT=main/topics

# Catalog file names are generated per environment and cluster.
# Example: topics-elc-sandbox-elc-sandbox-core-enterprise.json
TOPIC_CATALOG_FILE_TEMPLATE=topics-{environment}-{cluster}.json

# Tags are kept separate from topic definitions.
# Example: topic-tags-elc-sandbox-elc-sandbox-core-enterprise.json
TOPIC_TAGS_CATALOG_FILE_TEMPLATE=topic-tags-{environment}-{cluster}.json
